# Device PRIORS for the Planner's memory and latency predicates.
#
# Part 3 §14: these entries are **priors for un-probed devices**, not the source
# of truth. A device probe supersedes every value here, and a probed profile is
# what lets P_lat make a promise rather than only a refusal. The `unmeasured`
# markers below stay honest, but they stop being a blocker — the resolution is
# not buying twenty phones, it is making the customer's own device the
# measurement instrument.
#
#   python -m cli.main probe --device <name> --small-mb 200 --large-mb 400 \
#       --small-toks 42 --large-toks 22 --sustained-toks 11 --ram-free-mb 2600
#
# ram_gb                 total device RAM
# usable_ram_fraction    share the OS makes available at all (1.0 = all of it)
# app_reserve_gb         M_app — what the application and OS hold, as an explicit
#                        term so the memory breakdown can be audited line by line
# prefill_tok_s          prompt-processing rate, AT reference_params_b
# decode_tok_s           generation rate, AT reference_params_b
# reference_params_b     the model size those rates were quoted at. Rates are
#                        meaningless without it: prefill scales as 1/N_b (compute
#                        -bound) and decode as 1/M_w (bandwidth-bound), so the
#                        planner rescales them per candidate.
# latency_source         unmeasured | vendor | device_lab
#
# latency_source is UNMEASURED everywhere. P_lat REFUSES on an unmeasured device
# unless the spec sets io_schema.accept_unmeasured_latency, because effective
# throughput runs at 30-60% of peak and varies with thermal state, kernel quality
# and quantisation format. A planner that interpolates those is fabricating a
# promise. See GAP-10.
devices:
  - name: android_lowend
    ram_gb: 3
    usable_ram_fraction: 1.0
    app_reserve_gb: 1.20
    accelerator: cpu
    battery_wh: 11
    # SOURCE: llama.cpp CPU throughput band for a low-end ARM SoC, lower quartile.
    prefill_tok_s: 22
    decode_tok_s: 8
    reference_params_b: 1.7
    latency_source: unmeasured

  - name: android_midrange
    ram_gb: 6
    usable_ram_fraction: 1.0
    app_reserve_gb: 1.60
    accelerator: cpu
    battery_wh: 17
    # SOURCE: §8 of the Planner specification — "prompt processing 30-80 tok/s,
    # decode 10-20 tok/s for a 1.7B at Q4". Midpoints taken.
    prefill_tok_s: 50
    decode_tok_s: 16
    reference_params_b: 1.7
    latency_source: unmeasured

  - name: android_tablet_4gb
    ram_gb: 4
    usable_ram_fraction: 1.0
    app_reserve_gb: 1.40      # B-09's application and OS headroom
    accelerator: cpu
    battery_wh: 28
    # SOURCE: as android_midrange; the tablet SoC is in the same class.
    prefill_tok_s: 50
    decode_tok_s: 16
    reference_params_b: 1.7
    latency_source: unmeasured

  - name: android_flagship
    ram_gb: 12
    usable_ram_fraction: 1.0
    app_reserve_gb: 2.00
    accelerator: npu
    battery_wh: 19
    # SOURCE: NPU-accelerated prefill; decode remains bandwidth-bound so it gains
    # far less than prefill does. That asymmetry is the roofline, not a typo.
    prefill_tok_s: 140
    decode_tok_s: 26
    reference_params_b: 1.7
    latency_source: unmeasured

  - name: raspberry_pi4
    ram_gb: 4
    usable_ram_fraction: 1.0
    app_reserve_gb: 0.80      # headless: no UI stack to hold
    accelerator: cpu
    battery_wh: 0
    prefill_tok_s: 12
    decode_tok_s: 4
    reference_params_b: 1.7
    latency_source: unmeasured

  - name: laptop_cpu
    ram_gb: 16
    usable_ram_fraction: 1.0
    app_reserve_gb: 3.00
    accelerator: cpu
    battery_wh: 60
    prefill_tok_s: 180
    decode_tok_s: 32
    reference_params_b: 1.7
    latency_source: unmeasured

  - name: laptop_gpu
    ram_gb: 16
    usable_ram_fraction: 1.0
    app_reserve_gb: 3.00
    accelerator: gpu
    battery_wh: 80
    prefill_tok_s: 2200
    decode_tok_s: 95
    reference_params_b: 1.7
    latency_source: unmeasured
