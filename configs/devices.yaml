# Device profiles for the feasibility engine.
# ram_gb: total device RAM; accelerator: cpu|gpu|npu; compute_gflops: rough
# sustained throughput; battery_wh: battery capacity (0 => mains powered).
devices:
  - name: android_lowend
    ram_gb: 3
    accelerator: cpu
    compute_gflops: 15
    battery_wh: 11
  - name: android_midrange
    ram_gb: 6
    accelerator: cpu
    compute_gflops: 40
    battery_wh: 17
  - name: android_flagship
    ram_gb: 12
    accelerator: npu
    compute_gflops: 120
    battery_wh: 19
  - name: raspberry_pi4
    ram_gb: 4
    accelerator: cpu
    compute_gflops: 10
    battery_wh: 0
  - name: laptop_cpu
    ram_gb: 16
    accelerator: cpu
    compute_gflops: 200
    battery_wh: 60
  - name: laptop_gpu
    ram_gb: 16
    accelerator: gpu
    compute_gflops: 8000
    battery_wh: 80
