[project]
name = "majestic-llm"
version = "0.1.0"
description = "Majestic: task-specific model construction and evidence-aware local review."
requires-python = ">=3.10"
# Light runtime deps needed for the offline core system. Heavy ML deps
# (torch, transformers, peft, trl, faiss, onnx, ...) are optional and imported
# lazily; see requirements.txt and the [project.optional-dependencies] extras.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
ml = ["torch>=2.6", "transformers>=4.51,<5", "peft>=0.15,<0.19", "accelerate>=1,<2"]
qlora = ["bitsandbytes>=0.45"]
retrieval = ["sentence-transformers", "faiss-cpu"]
compress = ["bitsandbytes", "auto-gptq", "autoawq", "onnx", "onnxruntime"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
majestic = "cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["majestic*", "modelrig*", "api*", "cli*", "configs*", "frontend"]

[tool.setuptools.package-data]
configs = ["*.yaml", "specs/*.yaml"]
frontend = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The geometry table is column-aligned on purpose: every row is checked against
# the model's published config.json, and a wrong n_kv_heads is caught by eye far
# more easily in aligned columns than in wrapped continuations. Readability wins
# over the line limit for this one reference table.
"modelrig/planner/catalog.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Collect only the real suite. Release smoke-tests unpack a copy of the repo
# under outputs/, and pytest reads .gitignore for nothing — it would import
# that copy's conftest under the same module name as this one and abort the
# whole run on the collision.
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: tests that need heavy deps, network, or a GPU (skipped by default)",
]
filterwarnings = [
    # Cosmetic third-party deprecation from Starlette's TestClient (not our code).
    "ignore:Using .httpx. with .starlette.testclient.",
]
